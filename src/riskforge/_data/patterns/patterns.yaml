schema_version: "1.1.0"
# Each pattern names its high-risk route under Regulation (EU) 2024/1689: an Annex III
# point, or Article 6(1) with the Annex I legislation. Re-check the routes whenever
# Article 6, Annex I or Annex III is amended.
# Article 6(1) applies only where the product is required to undergo a third-party conformity assessment under that legislation (Art.6(1)(b)).
patterns:
  - pattern_id: CREDIT_SCORING_BIAS
    name: "Credit scoring: demographic bias risk"
    annex_iii_point: "5(b)"
    triggers:
      annex_iii_categories: [essential_services]
      purpose_keywords: ["credit", "loan", "mortgage", "underwriting"]
    risks:
      - dimension: discrimination
        title: "Demographic bias in credit scoring outputs"
        description: "Credit scoring models trained on historical data may encode systemic biases against protected groups (age, gender, ethnicity). Article 9(9) requires consideration of impacts on vulnerable groups."
        likelihood_hint: 3
        severity_hint: 4
        article_refs: ["Art.9(2)(a)", "Art.9(9)", "Art.10(2)(f)"]
        nist_rmf_ref: "MEASURE 2.9"
        iso42001_ref: "Clause A.7"
      - dimension: transparency
        title: "Lack of explanation for credit decisions"
        description: "Where a solely automated credit decision falls under GDPR Article 22(2)(a) or (c), Article 22(3) gives at least the right to obtain human intervention, to express a point of view and to contest the decision, and GDPR Articles 13(2)(f), 14(2)(g) and 15(1)(h) require meaningful information about the logic involved. The system may not currently support this."
        likelihood_hint: 3
        severity_hint: 3
        article_refs: ["Art.13", "Art.86(1)"]
        nist_rmf_ref: "GOVERN 1.7"
        iso42001_ref: "Clause A.6"

  - pattern_id: HIRING_SCREENING
    name: "Hiring and CV screening: risk cluster"
    annex_iii_point: "4(a)"
    triggers:
      annex_iii_categories: [employment]
      purpose_keywords: ["recruit", "hiring", "cv", "resume", "screening", "interview", "candidate"]
    risks:
      - dimension: discrimination
        title: "Proxy discrimination in automated CV screening"
        description: "Automated screening tools may use proxies (school name, postcode, employment gaps) that correlate with protected characteristics."
        likelihood_hint: 4
        severity_hint: 4
        article_refs: ["Art.9(2)(a)", "Art.10(2)(f)"]
        nist_rmf_ref: "MEASURE 2.9"
        iso42001_ref: "Clause A.7"
      - dimension: transparency
        title: "Lack of explainability for rejection decisions"
        description: "Candidates subject to automated CV screening may have a right to explanation under GDPR Article 22. The system may not be designed to provide this."
        likelihood_hint: 3
        severity_hint: 3
        article_refs: ["Art.13", "Art.14"]
        nist_rmf_ref: "GOVERN 1.7"
        iso42001_ref: "Clause A.6"
      - dimension: human_oversight
        title: "Automation bias in recruiter review of shortlisted candidates"
        description: "Recruiters presented with AI-ranked shortlists tend to follow the ranking without independent assessment. This undermines the human oversight requirement."
        likelihood_hint: 4
        severity_hint: 3
        article_refs: ["Art.14(3)"]
        nist_rmf_ref: "MANAGE 1.1"
        iso42001_ref: "Clause A.9"

  - pattern_id: LAW_ENFORCEMENT_BIOMETRIC
    name: "Law enforcement: biometric identification risk cluster"
    annex_iii_point: "1(a)"
    triggers:
      annex_iii_categories: [biometric, law_enforcement]
      purpose_keywords: ["facial recognition", "face recognition", "biometric", "identification", "surveillance", "matching"]
    risks:
      - dimension: fundamental_rights
        title: "Chilling effect on freedom of assembly and expression"
        description: "Real-time biometric identification in public spaces can have a chilling effect on fundamental rights even when technically lawful. Article 9(2)(a) requires this to be assessed."
        likelihood_hint: 4
        severity_hint: 5
        article_refs: ["Art.9(2)(a)"]
        nist_rmf_ref: "MAP 1.5"
        iso42001_ref: "Clause 6.1"
      - dimension: discrimination
        title: "Higher false match rates for under-represented demographic groups"
        description: "Facial recognition systems have documented higher false positive rates for darker skin tones and women. This creates discriminatory law enforcement outcomes."
        likelihood_hint: 4
        severity_hint: 5
        article_refs: ["Art.9(2)(a)", "Art.10(2)(f)"]
        nist_rmf_ref: "MEASURE 2.9"
        iso42001_ref: "Clause A.7"

  - pattern_id: EDUCATION_ASSESSMENT
    name: "Education: automated student assessment risk"
    annex_iii_point: "3(b)"
    triggers:
      annex_iii_categories: [education]
      purpose_keywords: ["assessment", "grading", "scoring", "evaluation", "marking"]
    risks:
      - dimension: discrimination
        title: "Bias in automated educational assessment"
        description: "Automated grading systems may unfairly penalise essays written in non-standard dialects or by non-native speakers, perpetuating educational inequality."
        likelihood_hint: 3
        severity_hint: 4
        article_refs: ["Art.9(2)(a)", "Art.10(2)(f)"]
        nist_rmf_ref: "MEASURE 2.9"
        iso42001_ref: "Clause A.7"
      - dimension: transparency
        title: "Students unable to understand or contest automated grade decisions"
        description: "Where automated assessment influences final grades or academic progression, students must be able to understand the basis and contest the outcome."
        likelihood_hint: 3
        severity_hint: 4
        article_refs: ["Art.13"]
        nist_rmf_ref: "GOVERN 1.7"
        iso42001_ref: "Clause A.6"

  - pattern_id: MEDICAL_DIAGNOSIS
    name: "Healthcare: medical diagnosis or clinical decision support"
    high_risk_route: annex_i
    article_6_ref: "Art.6(1)"
    annex_i_legislation:
      - "Regulation (EU) 2017/745 on medical devices (Annex I, Section A, point 11)"
      - "Regulation (EU) 2017/746 on in vitro diagnostic medical devices (Annex I, Section A, point 12)"
    triggers:
      annex_iii_categories: []
      purpose_keywords: ["medical diagnos", "clinical diagnos", "patient diagnos", "diagnostic imaging", "in vitro diagnostic", "clinical prognos", "clinical decision", "radiology", "medical imaging", "medical device"]
    risks:
      - dimension: health_safety
        title: "False negatives in medical screening causing delayed treatment"
        description: "AI-based screening tools that produce false negatives may delay life-critical treatment. The clinical consequences of failure should be estimated and evaluated (Art.9(2)(b))."
        likelihood_hint: 2
        severity_hint: 5
        article_refs: ["Art.9(2)(b)", "Art.14(1)"]
        nist_rmf_ref: "MAP 5.1"
        iso42001_ref: "Clause 6.1"
      - dimension: human_oversight
        title: "Clinician over-reliance on AI diagnostic suggestions"
        description: "Clinicians may defer to AI suggestions even when clinical judgement contradicts them. Human oversight may become nominal without workload safeguards."
        likelihood_hint: 3
        severity_hint: 5
        article_refs: ["Art.14"]
        nist_rmf_ref: "MANAGE 1.1"
        iso42001_ref: "Clause A.9"

  - pattern_id: MIGRATION_ASYLUM
    name: "Migration and asylum: decision support risk cluster"
    annex_iii_point: "7(c)"
    triggers:
      annex_iii_categories: [migration]
      purpose_keywords: ["asylum", "border", "visa", "migration", "refugee", "immigration"]
    risks:
      - dimension: fundamental_rights
        title: "AI-assisted asylum decisions affecting right to protection"
        description: "Errors in AI-assisted migration decisions can result in refoulement: return of persons to places where they face persecution. This is an absolute fundamental rights violation."
        likelihood_hint: 2
        severity_hint: 5
        article_refs: ["Art.9(2)(a)"]
        nist_rmf_ref: "MAP 1.5"
        iso42001_ref: "Clause 6.1"
      - dimension: transparency
        title: "Applicants unable to understand factors influencing their assessment"
        description: "Asylum seekers subject to AI-assisted assessment may not understand which factors were considered or how to address adverse outcomes."
        likelihood_hint: 3
        severity_hint: 4
        article_refs: ["Art.13"]
        nist_rmf_ref: "GOVERN 1.7"
        iso42001_ref: "Clause A.6"

  - pattern_id: CRIMINAL_RISK_ASSESSMENT
    name: "Law enforcement: offending risk assessment"
    annex_iii_point: "6(d)"
    triggers:
      annex_iii_categories: [law_enforcement]
      purpose_keywords: ["recidivism", "re-offending", "reoffending", "offending risk", "risk of offending", "criminal risk"]
    risks:
      - dimension: fundamental_rights
        title: "Risk assessment that relies solely on profiling"
        description: "Article 5(1)(d) prohibits AI systems that assess or predict the risk of a natural person committing a criminal offence based solely on profiling or on assessing their personality traits and characteristics, except where they support a human assessment already based on objective and verifiable facts directly linked to a criminal activity. Annex III point 6(d) covers systems used by or on behalf of law enforcement authorities, or by Union institutions, bodies, offices or agencies in support of them, to assess the risk of a natural person offending or re-offending not solely on the basis of profiling. Document how the system stays outside the Article 5(1)(d) prohibition."
        likelihood_hint: 3
        severity_hint: 5
        article_refs: ["Art.5(1)(d)", "Art.9(2)(a)"]
        nist_rmf_ref: "MAP 1.5"
        iso42001_ref: "Clause 6.1"
      - dimension: discrimination
        title: "Biased re-offending scores for protected groups"
        description: "Scores trained on historical arrest or conviction data can reproduce enforcement bias against protected groups. Article 9(9) requires providers to consider whether the system is likely to have an adverse impact on persons under 18 and, as appropriate, other vulnerable groups."
        likelihood_hint: 4
        severity_hint: 5
        article_refs: ["Art.9(2)(a)", "Art.9(9)", "Art.10(2)(f)"]
        nist_rmf_ref: "MEASURE 2.9"
        iso42001_ref: "Clause A.7"
      - dimension: human_oversight
        title: "Decision makers deferring to the risk score"
        description: "Law enforcement officers shown a risk score may follow it without an independent assessment, which weakens human oversight of decisions that can affect a person's liberty."
        likelihood_hint: 4
        severity_hint: 4
        article_refs: ["Art.14(1)", "Art.14(4)(b)"]
        nist_rmf_ref: "MANAGE 1.1"
        iso42001_ref: "Clause A.9"
