# Checked list of legal and standards references in src/ (PRD-368).
#
# tests/contract/test_legal_references.py extracts every reference from src/ and fails
# on any reference missing here. Keys use the extractor's normal form: "Art.9(8)",
# "GDPR Art.22(1)", "Charter Art.19(2)", "Annex III point 5(b)", "MEASURE 2.11".
# Unqualified "Art." keys are EU AI Act articles unless the note says otherwise.
#
# Every entry was checked against its source on 2026-10-15. Before adding an entry,
# check the reference against the official text and name the source. "unverified"
# marks a reference that exists but whose use in src/ could not be checked.

sources:
  aiact_oj:
    title: "Regulation (EU) 2024/1689, OJ L, 2024/1689, 12.7.2024 (CELEX 32024R1689)"
    url: "http://publications.europa.eu/resource/cellar/dc8116a1-3fe6-11ef-865a-01aa75ed71a1"
  aiact_consolidated:
    title: "Regulation (EU) 2024/1689, consolidated text as at 27.7.2026 (CELEX 02024R1689-20260727)"
    url: "http://publications.europa.eu/resource/cellar/b1730fb2-8f1c-11f1-9262-01aa75ed71a1"
  aiact_amendment:
    title: "Regulation (EU) 2026/1744, OJ L, 2026/1744, 24.7.2026 (CELEX 32026R1744)"
    url: "http://publications.europa.eu/resource/cellar/b459c07f-86fb-11f1-bf5e-01aa75ed71a1"
  gdpr:
    title: "Regulation (EU) 2016/679, OJ L 119, 4.5.2016 (CELEX 32016R0679)"
    url: "http://publications.europa.eu/resource/cellar/3e485e15-11bd-11e6-ba9a-01aa75ed71a1"
  charter:
    title: "Charter of Fundamental Rights of the European Union, OJ C 202, 7.6.2016"
    url: "http://publications.europa.eu/resource/cellar/c483a582-2c70-11e6-b497-01aa75ed71a1"
  mdr:
    title: "Regulation (EU) 2017/745 on medical devices (CELEX 32017R0745)"
    url: "http://publications.europa.eu/resource/celex/32017R0745"
  ivdr:
    title: "Regulation (EU) 2017/746 on in vitro diagnostic medical devices (CELEX 32017R0746)"
    url: "http://publications.europa.eu/resource/celex/32017R0746"
  nist_ai_rmf:
    title: "NIST AI 100-1, Artificial Intelligence Risk Management Framework (AI RMF 1.0), January 2023"
    url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"
  iso42001_toc:
    title: "AS ISO/IEC 42001:2023 table of contents (identical adoption of ISO/IEC 42001:2023)"
    url: "https://store.standards.org.au/product/as-iso-iec-42001-2023"

