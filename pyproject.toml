[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "riskforge"
version = "1.1.3"
description = "EU AI Act Article 9 Risk Management System — open-source CLI"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "AI Exponent LLC", email = "hello@aiexponent.com"}]
keywords = ["eu-ai-act", "article-9", "risk-management", "compliance", "ai-governance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# Bounded runtime dependencies — enables flexible installation across enterprise
# environments (preventing version conflicts with Pydantic, Jinja2, Rich, etc.),
# while reproducible builds and bite-identical regulatory audit evidence for Article 9
# RMF generation are guaranteed via lockfiles (uv.lock / requirements.lock) in CI
# and Docker builds. CONTRIBUTING.md documents the lockfile and upgrade workflow.
dependencies = [
    "typer>=0.12.3,<0.13.0",
    # Click 8.3+ broke is_eager callback dispatch for Typer 0.12.x — `riskforge --version`
    # silently no-ops. Pin to <8.2 until Typer ships a compatible release. Verified
    # 2026-05-10 on Python 3.12.2 against click 8.3.3 (broken) and 8.1.7 (working).
    "click>=8.1,<8.2",
    "pydantic>=2.7.1,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "weasyprint>=70.0,<71.0",
    "jinja2>=3.1.4,<4.0.0",
    "rich>=13.7.1,<14.0.0",
    "questionary>=2.0.1,<3.0.0",
    "keyring>=25.2.1,<26.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "packaging>=24.0,<25.0",
    "filelock>=3.14.0,<4.0.0",
]

[project.urls]
Homepage      = "https://github.com/aiexponent/riskforge"
Repository    = "https://github.com/aiexponent/riskforge.git"
Documentation = "https://github.com/aiexponent/riskforge/tree/main/docs"
Issues        = "https://github.com/aiexponent/riskforge/issues"
Changelog     = "https://github.com/aiexponent/riskforge/releases"

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "structlog>=24.1.0,<25.0.0",
    "slowapi>=0.1.9,<1.0.0",
]
dev = ["riskforge[server,test]", "pre-commit>=3.7.1,<5.0.0", "hatch>=1.9.4,<2.0.0", "pip-audit>=2.7.3,<3.0.0"]
test = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "bandit>=1.7.8,<2.0.0",
]

[project.scripts]
riskforge = "riskforge.cli.main:app"

[project.entry-points."riskforge.question_banks"]
health_safety      = "riskforge.plugins.builtin:HealthSafetyBank"
fundamental_rights = "riskforge.plugins.builtin:FundamentalRightsBank"
discrimination     = "riskforge.plugins.builtin:DiscriminationBank"
privacy            = "riskforge.plugins.builtin:PrivacyBank"
transparency       = "riskforge.plugins.builtin:TransparencyBank"
human_oversight    = "riskforge.plugins.builtin:HumanOversightBank"
robustness         = "riskforge.plugins.builtin:RobustnessBank"
data_governance    = "riskforge.plugins.builtin:DataGovernanceBank"

[project.entry-points."riskforge.exporters"]
json     = "riskforge.exporters.json_exporter:JSONExporter"
pdf      = "riskforge.exporters.pdf.pdf_exporter:PDFExporter"
markdown = "riskforge.exporters.markdown_exporter:MarkdownExporter"

[project.entry-points."riskforge.adapters"]
rag-benchmarking = "riskforge.adapters.rag_benchmarking:RAGBenchmarkingAdapter"
traceforge        = "riskforge.adapters.traceforge:TraceForgeAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/riskforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "S101",   # assert in tests
    "B008",   # typer.Option/Argument in function defaults — required by Typer
    "B904",   # raise-without-from-inside-except — many CLI handlers intentionally reraise
    "UP042",  # str+Enum inheritance — intentional for JSON/YAML string serialisation
    "E501",   # line too long — handled by formatter; some long strings are unavoidable
]

[tool.ruff.lint.per-file-ignores]
# Typer 0.12.3 requires Optional[X] — str | None (types.UnionType) raises RuntimeError.
# UP007 suppresses Optional[X]→X|None in ruff <0.15 (CI uses ruff 0.4.4).
# ruff 0.15+ renamed this to UP045; UP045 is intentionally absent here because
# ruff 0.4.4 would fail on an unknown rule selector. Accept UP045 warnings locally.
"src/riskforge/cli/commands/*.py" = ["UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --disable-socket"

[tool.coverage.run]
source = ["riskforge"]
branch = true

[tool.coverage.report]
# CI runs the FULL test suite (unit + integration + contract + boundary) via
# `pytest --cov` in .github/workflows/ci.yml, so the measured number is the
# full-suite coverage (~65% as of this pass). The floor is set with a small margin
# below that. The main remaining gap is the optional, experimental `riskforge.server`
# package; raise the floor further once it is tested (or excluded from the source).
fail_under = 60
