name: License Compatibility (LCC dogfooding)

# Every released AiExponent tool runs License Compliance Checker against itself.
# A license violation fails this job.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  lcc-scan:
    name: LCC self-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install License Compliance Checker
        run: |
          python -m pip install --upgrade pip
          pip install "license-compliance-checker==2.0.2"

      - name: Run LCC scan (permissive policy)
        env:
          LCC_POLICY_DIR: ${{ runner.temp }}/lcc-policies
          LCC_CACHE_DIR: ${{ runner.temp }}/lcc-cache
        run: |
          lcc scan . \
            --format json \
            --output lcc-report.json \
            --policy permissive \
            --exclude "tests/**" \
            --exclude ".git/**" \
            --exclude "dist/**" \
            --exclude "build/**"

      - name: Upload LCC report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcc-report
          path: lcc-report.json
          if-no-files-found: warn
