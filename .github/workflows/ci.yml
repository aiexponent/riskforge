name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  # Manual trigger. Without it a CI failure on `main` that came from a newly
  # published advisory rather than a new commit could not be reproduced on
  # demand, only by pushing an unrelated commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install WeasyPrint system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install WeasyPrint system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango cairo gdk-pixbuf libffi

      - name: Install RiskForge with dev extras
        run: |
          if [ -f requirements.lock ]; then
            pip install -c requirements.lock -e ".[dev]"
          else
            pip install -e ".[dev]"
          fi

      - name: Run test suite
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  schema-validate:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate rmf.schema.json is valid JSON Schema
        run: |
          python -c "
          import json, jsonschema
          schema = json.load(open('src/riskforge/_data/schemas/rmf.schema.json'))
          jsonschema.Draft202012Validator.check_schema(schema)
          print('Schema valid:', schema.get('\$id'))
          "

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Static security analysis
        run: bandit -ll -r src/

      - name: Dependency vulnerability audit
        # Advisories waived below are ones RiskForge is verified not exposed to and that cannot or
        # need not be fixed. Re-audit each on any dependency bump.
        #  PYSEC-2026-2132 (click, CVE-2026-7246): command injection in click.edit(). RiskForge never
        #    calls click.edit() or launches an editor. The fix is click 8.3.3, which breaks Typer 0.12.3
        #    --version dispatch (the reason for the click<8.2 pin). Not exposed; cannot upgrade.
        #  PYSEC-2026-3447 (setuptools, CVE-2026-59890): MANIFEST.in exclusion bypass. setuptools is not a
        #    build or runtime dependency of RiskForge (hatchling backend). Not exposed.
        run: |
          if [ -f requirements.lock ]; then
            pip install -c requirements.lock -e ".[dev]"
          else
            pip install -e ".[dev]"
          fi
          # Not --strict: pip-audit still exits non-zero on any real vulnerability in
          # an auditable dependency, but a non-strict run does not fail on the
          # editable-installed project itself (riskforge), whose bumped version may
          # not be on PyPI yet during a release.
          pip-audit \
            --ignore-vuln PYSEC-2026-2132 \
            --ignore-vuln PYSEC-2026-3447

  boundary-test:
    name: Import Boundary Enforcement (ADR-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install RiskForge
        run: |
          if [ -f requirements.lock ]; then
            pip install -c requirements.lock -e ".[test]"
          else
            pip install -e ".[test]"
          fi

      - name: Run boundary tests
        run: pytest tests/boundary/ -v
