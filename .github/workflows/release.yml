name: Release to PyPI

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  id-token: write    # PyPI OIDC trusted publishing
  contents: write    # GitHub Release creation
  attestations: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: pypi-publish
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install dev dependencies + build frontend
        run: |
          pip install build pip-audit bandit
          if [ -f requirements.lock ]; then
            pip install -c requirements.lock -e ".[dev]"
          else
            pip install -e ".[dev]"
          fi

      - name: Security gates
        # Same posture as ci.yml: bandit gates on medium+; pip-audit gates with the
        # documented waivers (RiskForge is not exposed; see ci.yml for justifications).
        run: |
          bandit -ll -r src/
          pip-audit \
            --ignore-vuln PYSEC-2026-2132 \
            --ignore-vuln PYSEC-2026-3412 \
            --ignore-vuln PYSEC-2026-3447

      - name: Run the full test suite
        run: pytest --cov

      - name: Build wheel + sdist
        run: python -m build

      - name: List built artifacts
        run: ls -lh dist/

      - name: Generate CycloneDX SBOM
        # No `|| true`: a failed SBOM must fail the release, since it is attached to
        # the GitHub Release below. `--output-format JSON --outfile` is the correct
        # cyclonedx-bom 4.x invocation (the previous `--format json` flag does not exist).
        run: |
          pip install "cyclonedx-bom<5"
          cyclonedx-py environment --output-format JSON --outfile sbom.cdx.json

      - name: Attest build provenance (GitHub + Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Publish to PyPI (OIDC trusted publisher)
        uses: pypa/gh-action-pypi-publish@v1.14.2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json
