name: Release to PyPI

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  id-token: write    # PyPI OIDC trusted publishing
  contents: write    # GitHub Release creation
  attestations: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: pypi-publish
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install dev dependencies + build frontend
        run: |
          # setuptools: see the same step in ci.yml.
          pip install --upgrade setuptools build pip-audit bandit
          if [ -f requirements.lock ]; then
            pip install -c requirements.lock -e ".[dev]"
          else
            pip install -e ".[dev]"
          fi

      - name: Security gates
        # Same posture as ci.yml: bandit gates on medium+; pip-audit gates with the
        # documented waivers (RiskForge is not exposed; see ci.yml for justifications).
        run: |
          bandit -ll -r src/
          pip-audit \
            --ignore-vuln PYSEC-2026-2132 \
            --ignore-vuln PYSEC-2026-3447

      - name: Run the full test suite
        run: pytest --cov

      - name: Check the schemas published on aiexponent.com
        # The schemas' $id values are these URLs; the hosted files must match the package byte for byte.
        # With RISKFORGE_RELEASE_CHECK set, a command that selects no release test or skips it fails.
        env:
          RISKFORGE_RELEASE_CHECK: "1"
        run: pytest -m release tests/release -p no:cacheprovider

      - name: Build wheel + sdist
        run: python -m build

      - name: List built artifacts
        run: ls -lh dist/

      - name: Generate CycloneDX SBOM
        # No `|| true`: a failed SBOM must fail the release, since it is attached to
        # the GitHub Release below. `--output-format JSON --outfile` is the correct
        # cyclonedx-bom 4.x invocation (the previous `--format json` flag does not exist).
        run: |
          pip install "cyclonedx-bom<5"
          cyclonedx-py environment --output-format JSON --outfile sbom.cdx.json

      - name: Attest build provenance (GitHub + Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Publish to PyPI (OIDC trusted publisher)
        # Only a version tag publishes, so every published version also gets verify-release.
        # A manual run from a branch builds and tests but does not publish.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@v1.14.2

      - name: Create GitHub Release
        # A release needs a tag; a manual run from a branch stops after the build and tests.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json

  verify-release:
    name: Independent verification of the released version
    # Runs verification/run.sh against the version just published to PyPI.
    # It fails when a check fails or the RMF differs from the committed
    # verification/results/rmf.normalised.json: the release stays published,
    # and the verification report must be redone for this version.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait until PyPI serves the new version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          # PyPI's index can take a few minutes to reach every CDN node after the
          # JSON API lists a release. Ask pip itself, the way run.sh installs,
          # until it resolves the version three times in a row.
          seen=0
          for _ in $(seq 1 60); do
            dest="$(mktemp -d)"
            ok=0
            python3 -m pip download --quiet --no-deps --no-cache-dir \
              --dest "$dest" "riskforge==${VERSION}" > /dev/null 2>&1 && ok=1
            rm -rf "$dest"
            if [ "$ok" -eq 1 ]; then
              seen=$((seen + 1))
              if [ "$seen" -ge 3 ]; then exit 0; fi
            else
              seen=0
            fi
            sleep 20
          done
          echo "pip cannot resolve riskforge ${VERSION} after 20 minutes" >&2
          exit 1
      - name: Run verification/run.sh
        env:
          TAG_NAME: ${{ github.ref_name }}
          OUT: ${{ runner.temp }}/verification
        run: |
          smoke=""
          if [ ! -f verification/inputs/decisions.yaml ]; then smoke="--smoke"; fi
          verification/run.sh --out "$OUT" --version "${TAG_NAME#v}" ${smoke:+"$smoke"}
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-results
          path: |
            ${{ runner.temp }}/verification/results.json
            ${{ runner.temp }}/verification/rmf.normalised.json
            ${{ runner.temp }}/verification/gates.json
            ${{ runner.temp }}/verification/run-a/export/
            ${{ runner.temp }}/verification/run-a/logs/
            ${{ runner.temp }}/verification/run-b/logs/
          if-no-files-found: ignore
          retention-days: 90
