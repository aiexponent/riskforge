version: 2

# Monthly runs (PRD-315, 2026-10-11) keep bot PRs to one batch a month.
# Security updates do not follow this schedule and still arrive right away.

# One grouped PR per ecosystem for routine minor and patch bumps, and one
# grouped PR for security fixes. Routine major bumps are not proposed for pip:
# they are migrations and get planned by hand. Security updates are not
# affected by that rule. The cooldown keeps versions published in the last
# week out of version PRs.

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      actions:
        patterns: ["*"]
